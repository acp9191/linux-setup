name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -x -S warning ./*.sh scripts/*.sh

  install:
    name: install (${{ matrix.os }})
    strategy:
      # Run every release to completion, so a 26.04 failure doesn't hide 24.04 results.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Lets `gh auth status` pass and avoids GitHub API rate limits in mise.
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: ./install.sh
      - name: Re-run install (idempotency)
        run: ./install.sh
      - name: Repository unchanged by install
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - name: Check
        run: ./check.sh
      - name: Run scheduled tool update
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          status=0
          systemctl --user start linux-setup-update.service || status=$?
          journalctl --user -u linux-setup-update --no-pager -o cat || true
          exit "$status"
